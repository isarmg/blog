# Project-owned consolidation; immutable upstream origins remain in compliance.
[package]
edition = "2021"
rust-version = "1.57.0"
name = "blog-network-http-message"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "HTTP messages and header codecs"
license = "MIT"
publish = false

[features]
default = ["std"]
std = []

[lib]
name = "blog_network_http_message"
path = "src/lib.rs"

[[test]]
name = "accepted-encodings"
path = "../../../../test/foundation/network/http-message/integration/accepted-encodings.rs"

[dependencies.bytes]
path = "../../encoding/byte-buffer"
package = "blog-encoding-byte-buffer"

[dependencies.itoa]
path = "../../encoding/integer-format"
package = "blog-encoding-integer-format"

