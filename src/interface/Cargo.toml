[package]
autotests = false
name = "blog-interface"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
description = "博客组件、浏览器 API、主题和应用挂载"
publish = false
build = "../tools/assets/src/platform_contract.rs"

[dependencies]
thiserror = { path = "../foundation/diagnostics/typed-error", package = "blog-diagnostics-typed-error" }
blog-dom = {  default-features = false, features = ["csr"], path = "dom"}
serde = {  features = ["derive"], path = "../foundation/format/data-model",package = "blog-format-data-model"}
serde_json = { path = "../foundation/format/json",package = "blog-format-json"}
wasm-bindgen = { path = "../foundation/wasm/browser-bridge",package = "blog-wasm-browser-bridge"}
js-sys = { path = "../foundation/interface/javascript-api", package = "blog-interface-javascript-api", default-features = false, features = ["std"] }
web-sys = { features = [
  "AbortController", "AbortSignal", "Blob", "BlobPropertyBag", "CssStyleDeclaration",
  "CustomEvent", "CustomEventInit", "Document", "DomException", "DomRect", "DomRectList",
  "Element", "Event", "EventTarget", "File", "FontFaceSet", "Headers", "History",
  "HtmlDialogElement", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "Location",
  "MediaQueryList", "MediaQueryListEvent", "MutationObserver", "MutationObserverInit",
  "MutationRecord", "Navigator", "Node", "NodeList", "PageTransitionEvent",
  "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestCache",
  "RequestCredentials", "RequestInit", "RequestRedirect", "ResizeObserver", "Response",
  "Storage", "SvgAnimatedRect", "SvgElement", "SvgGraphicsElement", "SvgMatrix",
  "SvgRect", "SvgsvgElement", "TransitionEvent", "Url", "UrlSearchParams", "Window",
  "console",
], path = "../foundation/interface/browser-api",package = "blog-interface-browser-api"}

[features]
default = ["csr"]
csr = ["blog-dom/csr"]

[dependencies.futures]
path = "../foundation/runtime/async-toolkit"
package = "blog-runtime-async-toolkit"
default-features = false
features = ["shared-state"]


[[test]]
name = "csr_components"
path = "../../test/interface/integration/csr_components.rs"

[[test]]
name = "executor_overrides"
path = "../../test/interface/integration/executor_overrides.rs"

[[test]]
name = "kernel_state"
path = "../../test/interface/integration/kernel_state.rs"

[[example]]
name = "corner-listener-contracts"
path = "../../test/interface/browser/fixture.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
